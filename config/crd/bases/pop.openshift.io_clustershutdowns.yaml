---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.1
  name: clustershutdowns.pop.openshift.io
spec:
  group: pop.openshift.io
  names:
    kind: ClusterShutdown
    listKind: ClusterShutdownList
    plural: clustershutdowns
    singular: clustershutdown
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.dryRun
      name: DryRun
      type: boolean
    - jsonPath: .status.totalNodes
      name: Nodes
      type: integer
    - jsonPath: .status.shutdownNodes
      name: Shutdown
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ClusterShutdown orchestrates a full OpenShift graceful shutdown:
          validate prerequisites, back up etcd, and shut down all nodes.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ClusterShutdownSpec defines the desired state of ClusterShutdown.
            properties:
              certExpiryThresholdDays:
                default: 30
                description: |-
                  CertExpiryThresholdDays is the minimum remaining certificate lifetime
                  (in days) required before proceeding with shutdown. If the certificate
                  expires sooner, the shutdown is rejected.
                format: int32
                minimum: 1
                type: integer
              cordonNodes:
                default: true
                description: CordonNodes when true cordons all nodes before shutdown.
                type: boolean
              drainTimeoutSeconds:
                default: 300
                description: DrainTimeoutSeconds is the maximum time to wait for pod
                  evictions per node.
                format: int32
                maximum: 1800
                minimum: 30
                type: integer
              dryRun:
                default: false
                description: |-
                  DryRun when true validates prerequisites and takes an etcd backup
                  but does NOT shut down nodes.
                type: boolean
              notifyApplications:
                default: true
                description: |-
                  NotifyApplications when true creates a ConfigMap signal that
                  applications can watch to prepare for shutdown.
                type: boolean
              preShutdownHooks:
                description: |-
                  PreShutdownHooks is a list of Jobs to run before shutdown.
                  All hooks must complete successfully before proceeding.
                items:
                  properties:
                    command:
                      description: Command is the command to execute.
                      items:
                        type: string
                      type: array
                    image:
                      description: Image is the container image to run.
                      type: string
                    name:
                      description: Name is a human-readable identifier for this hook.
                      type: string
                    timeoutSeconds:
                      default: 300
                      description: TimeoutSeconds is the maximum time for this hook
                        to complete.
                      format: int32
                      type: integer
                  required:
                  - command
                  - image
                  - name
                  - timeoutSeconds
                  type: object
                type: array
              pvcName:
                description: PVCName is the name of the PVC for the etcd backup.
                minLength: 1
                type: string
              reason:
                description: Reason documents why the shutdown is happening (audit
                  trail).
                type: string
              scheduledTime:
                description: |-
                  ScheduledTime is a future time to begin the shutdown.
                  If set, the controller waits until this time before proceeding.
                format: date-time
                type: string
              shutdownDelayMinutes:
                default: 1
                description: |-
                  ShutdownDelayMinutes is the delay passed to `shutdown -h` on worker nodes.
                  Control plane nodes receive double this value so workers shut down first.
                format: int32
                maximum: 60
                minimum: 1
                type: integer
              skipCertCheck:
                default: false
                description: SkipCertCheck when true bypasses the kube-apiserver certificate
                  expiry check.
                type: boolean
              skipPreflightChecks:
                default: false
                description: |-
                  SkipPreflightChecks when true bypasses enhanced pre-flight checks
                  (degraded operators, in-progress updates).
                type: boolean
              workloadEvacuationRef:
                description: |-
                  WorkloadEvacuationRef optionally references a WorkloadEvacuation CR.
                  If set, the controller waits for evacuation to complete before shutting down.
                type: string
            required:
            - pvcName
            type: object
          status:
            description: ClusterShutdownStatus defines the observed state of ClusterShutdown.
            properties:
              certificateExpiry:
                description: CertificateExpiry is the detected certificate expiry
                  time.
                format: date-time
                type: string
              clusterType:
                description: |-
                  ClusterType is the detected topology: SingleNode (SNO) or MultiNode.
                  Determines whether the drain phase performs pod eviction.
                enum:
                - SingleNode
                - MultiNode
                type: string
              completionTime:
                description: CompletionTime is when the process completed.
                format: date-time
                type: string
              conditions:
                description: Conditions represent the latest available observations.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              cordonedNodes:
                description: CordonedNodes is the count of nodes that have been cordoned.
                format: int32
                type: integer
              estimatedCompletionTime:
                description: EstimatedCompletionTime is the estimated time the shutdown
                  will complete.
                format: date-time
                type: string
              etcdBackupRef:
                description: EtcdBackupRef is the name of the EtcdBackup CR created
                  for this shutdown.
                type: string
              hookStatuses:
                description: HookStatuses tracks pre-shutdown hook execution.
                items:
                  properties:
                    jobName:
                      description: JobName is the name of the Job created for this
                        hook.
                      type: string
                    message:
                      description: Message provides detail.
                      type: string
                    name:
                      description: Name of the hook.
                      type: string
                    phase:
                      description: Phase is Pending, Running, Completed, or Failed.
                      type: string
                  required:
                  - name
                  - phase
                  type: object
                type: array
              message:
                description: Message provides detail about the current phase.
                type: string
              nodeStatuses:
                description: NodeStatuses tracks the shutdown state per node.
                items:
                  properties:
                    message:
                      description: Message provides detail about the node shutdown
                        status.
                      type: string
                    name:
                      description: Name of the node.
                      type: string
                    role:
                      description: Role is "control-plane" or "worker".
                      type: string
                    shutdownPodName:
                      description: ShutdownPodName is the name of the pod that initiated
                        shutdown on this node.
                      type: string
                    status:
                      description: Status is "Pending", "ShuttingDown", "Shutdown",
                        or "Failed".
                      type: string
                  required:
                  - name
                  - role
                  - status
                  type: object
                type: array
              observedGeneration:
                description: ObservedGeneration is the most recent generation observed.
                format: int64
                type: integer
              phase:
                description: Phase is the current phase.
                enum:
                - Pending
                - Scheduled
                - Validating
                - Cordoning
                - Draining
                - RunningHooks
                - NotifyingApps
                - BackingUp
                - ShuttingDown
                - Complete
                - Failed
                type: string
              preflightStatus:
                description: PreflightStatus summarizes pre-flight check results.
                properties:
                  degradedOperators:
                    description: DegradedOperators lists ClusterOperators that are
                      Degraded.
                    items:
                      type: string
                    type: array
                  message:
                    description: Message provides detail about failures.
                    type: string
                  passed:
                    description: Passed indicates whether all checks passed.
                    type: boolean
                  updateInProgress:
                    description: UpdateInProgress is true if a cluster version update
                      is in progress.
                    type: boolean
                required:
                - passed
                - updateInProgress
                type: object
              shutdownNodes:
                description: ShutdownNodes is the count of nodes that have been issued
                  a shutdown command.
                format: int32
                type: integer
              startTime:
                description: StartTime is when the shutdown process started.
                format: date-time
                type: string
              totalNodes:
                description: TotalNodes is the total number of nodes targeted.
                format: int32
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
