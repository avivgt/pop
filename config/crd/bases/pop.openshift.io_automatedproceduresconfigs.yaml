---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.1
  name: automatedproceduresconfigs.pop.openshift.io
spec:
  group: pop.openshift.io
  names:
    kind: AutomatedProceduresConfig
    listKind: AutomatedProceduresConfigList
    plural: automatedproceduresconfigs
    singular: automatedproceduresconfig
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.clusterPriority
      name: Priority
      type: string
    - jsonPath: .status.powerStatus
      name: Power
      type: string
    - jsonPath: .spec.autonomousShutdown
      name: Autonomous
      type: boolean
    - jsonPath: .spec.enabled
      name: Enabled
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: AutomatedProceduresConfig defines automated event response for
          the cluster.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: AutomatedProceduresConfigSpec defines the desired state of
              AutomatedProceduresConfig.
            properties:
              alertEndpoint:
                description: AlertEndpoint configures the PSU alert webhook receiver.
                properties:
                  authTokenSecret:
                    description: |-
                      AuthTokenSecret is the name of a Secret containing a "token" key
                      used for bearer token authentication on the alert endpoint.
                    type: string
                  port:
                    default: 8082
                    description: Port is the HTTP port for the PSU alert webhook receiver.
                    format: int32
                    maximum: 65535
                    minimum: 1024
                    type: integer
                type: object
              autonomousShutdown:
                default: false
                description: |-
                  AutonomousShutdown when true automatically shuts down the cluster
                  after the confirmation period + priority delay without human intervention.
                type: boolean
              backupConfig:
                description: BackupConfig defines backup storage for emergency backups.
                properties:
                  exportTarget:
                    description: ExportTarget optionally configures S3 export for
                      emergency backups.
                    properties:
                      s3:
                        description: S3 is required when Type is S3.
                        properties:
                          bucket:
                            description: Bucket is the S3 bucket name.
                            minLength: 1
                            type: string
                          credentialsSecret:
                            description: CredentialsSecret is the name of a Secret
                              containing "access-key" and "secret-key".
                            minLength: 1
                            type: string
                          endpoint:
                            description: Endpoint is the S3-compatible endpoint URL
                              (for MinIO, ODF, etc.).
                            type: string
                          prefix:
                            description: Prefix is a path prefix within the bucket.
                            type: string
                          region:
                            default: us-east-1
                            description: Region is the AWS region.
                            type: string
                        required:
                        - bucket
                        - credentialsSecret
                        type: object
                      type:
                        default: PVC
                        description: Type is PVC or S3.
                        enum:
                        - PVC
                        - S3
                        type: string
                    required:
                    - type
                    type: object
                  pvcName:
                    description: PVCName is the PVC for emergency backup storage.
                    minLength: 1
                    type: string
                  shutdownDelayMinutes:
                    default: 1
                    description: ShutdownDelayMinutes is passed to ClusterShutdown
                      during autonomous shutdown.
                    format: int32
                    minimum: 1
                    type: integer
                required:
                - pvcName
                type: object
              batteryCapacityMinutes:
                default: 15
                description: BatteryCapacityMinutes is the expected UPS battery duration.
                format: int32
                minimum: 1
                type: integer
              clusterPriority:
                default: Standard
                description: ClusterPriority determines the shutdown delay tier for
                  this cluster.
                enum:
                - Critical
                - Standard
                - BestEffort
                type: string
              enabled:
                default: false
                description: Enabled is the master switch for automated procedures.
                type: boolean
              eventSources:
                description: EventSources configures how power and infrastructure
                  events are detected.
                properties:
                  ipmi:
                    description: IPMI configures IPMI/Redfish BMC power monitoring.
                    properties:
                      authSecret:
                        description: AuthSecret is the name of a Secret with BMC credentials
                          (username, password).
                        type: string
                      enabled:
                        default: false
                        description: Enabled activates IPMI/Redfish monitoring.
                        type: boolean
                      host:
                        description: Host is the BMC address.
                        type: string
                      pollingIntervalSeconds:
                        default: 30
                        description: PollingIntervalSeconds is how often to poll the
                          BMC.
                        format: int32
                        minimum: 5
                        type: integer
                      port:
                        default: 443
                        description: Port is the BMC port.
                        format: int32
                        type: integer
                      protocol:
                        default: redfish
                        description: Protocol is "redfish" or "ipmi".
                        enum:
                        - redfish
                        - ipmi
                        type: string
                      tlsInsecure:
                        default: false
                        description: TLSInsecure skips TLS certificate verification.
                        type: boolean
                    required:
                    - authSecret
                    - enabled
                    type: object
                  nut:
                    description: NUT configures Network UPS Tools client monitoring.
                    properties:
                      authSecret:
                        description: AuthSecret is the name of a Secret with NUT credentials
                          (username, password).
                        type: string
                      enabled:
                        default: false
                        description: Enabled activates NUT client monitoring.
                        type: boolean
                      host:
                        description: Host is the NUT server address.
                        type: string
                      pollingIntervalSeconds:
                        default: 10
                        description: PollingIntervalSeconds is how often to poll the
                          NUT server.
                        format: int32
                        minimum: 5
                        type: integer
                      port:
                        default: 3493
                        description: Port is the NUT server port.
                        format: int32
                        type: integer
                      upsName:
                        description: UPSName is the UPS identifier on the NUT server.
                        type: string
                    required:
                    - enabled
                    - upsName
                    type: object
                  snmp:
                    description: SNMP configures SNMP polling of UPS devices.
                    properties:
                      authSecret:
                        description: AuthSecret is the name of a Secret with SNMPv3
                          credentials (username, authPass, privPass).
                        type: string
                      batteryRemainingOID:
                        description: BatteryRemainingOID is the OID for estimated
                          battery minutes remaining.
                        type: string
                      batteryStatusOID:
                        description: 'BatteryStatusOID is the OID for UPS battery
                          status (default: UPS-MIB 1.3.6.1.2.1.33.1.2.1.0).'
                        type: string
                      community:
                        default: public
                        description: Community is the SNMP v2c community string.
                        type: string
                      enabled:
                        default: false
                        description: Enabled activates SNMP polling.
                        type: boolean
                      host:
                        description: Host is the SNMP agent address (UPS/PDU).
                        type: string
                      outputSourceOID:
                        description: 'OutputSourceOID is the OID for UPS output source
                          (default: UPS-MIB 1.3.6.1.2.1.33.1.4.1.0).'
                        type: string
                      pollingIntervalSeconds:
                        default: 30
                        description: PollingIntervalSeconds is how often to poll the
                          device.
                        format: int32
                        minimum: 5
                        type: integer
                      port:
                        default: 161
                        description: Port is the SNMP port.
                        format: int32
                        type: integer
                      version:
                        default: v2c
                        description: 'Version is the SNMP version: "v2c" or "v3".'
                        enum:
                        - v2c
                        - v3
                        type: string
                    required:
                    - enabled
                    type: object
                  webhook:
                    description: Webhook is the existing PSU alert webhook receiver.
                    properties:
                      authTokenSecret:
                        description: |-
                          AuthTokenSecret is the name of a Secret containing a "token" key
                          used for bearer token authentication on the alert endpoint.
                        type: string
                      port:
                        default: 8082
                        description: Port is the HTTP port for the PSU alert webhook
                          receiver.
                        format: int32
                        maximum: 65535
                        minimum: 1024
                        type: integer
                    type: object
                type: object
              managementURL:
                description: ManagementURL is the URL of the UPS/PDU management interface.
                type: string
              notification:
                description: Notification configures notification channels.
                properties:
                  alertmanager:
                    description: Alertmanager configures Alertmanager push notifications.
                    properties:
                      enabled:
                        default: false
                        description: Enabled activates Alertmanager notifications.
                        type: boolean
                      url:
                        description: |-
                          URL is the Alertmanager API endpoint.
                          Defaults to the cluster's built-in Alertmanager if empty.
                        type: string
                    required:
                    - enabled
                    type: object
                  kubernetesEvents:
                    description: KubernetesEvents configures K8s Event emission.
                    properties:
                      enabled:
                        default: true
                        description: Enabled activates Kubernetes Event emission.
                        type: boolean
                    required:
                    - enabled
                    type: object
                  smtp:
                    description: SMTP configures email notifications.
                    properties:
                      credentialsSecret:
                        description: CredentialsSecret is the name of a Secret with
                          "username" and "password".
                        type: string
                      enabled:
                        default: false
                        description: Enabled activates SMTP email notifications.
                        type: boolean
                      from:
                        description: From is the sender email address.
                        type: string
                      host:
                        description: Host is the SMTP server hostname.
                        type: string
                      port:
                        default: 587
                        description: Port is the SMTP server port.
                        format: int32
                        type: integer
                      to:
                        description: To is the list of recipient email addresses.
                        items:
                          type: string
                        type: array
                      useTLS:
                        default: true
                        description: UseTLS enables STARTTLS.
                        type: boolean
                    required:
                    - enabled
                    type: object
                  webhook:
                    description: Webhook configures generic HTTP webhook notifications.
                    properties:
                      authSecret:
                        description: |-
                          AuthSecret is the name of a Secret containing an "authorization" key
                          sent as the Authorization header.
                        type: string
                      enabled:
                        default: false
                        description: Enabled activates webhook notifications.
                        type: boolean
                      url:
                        description: URL is the target for POST JSON notifications.
                        type: string
                    required:
                    - enabled
                    type: object
                type: object
              powerConfirmationSeconds:
                default: 120
                description: PowerConfirmationSeconds is how long to wait before confirming
                  a power outage.
                format: int32
                minimum: 10
                type: integer
              shutdownDelayOverrideSeconds:
                description: ShutdownDelayOverrideSeconds overrides the tier-based
                  shutdown delay.
                format: int32
                type: integer
            required:
            - backupConfig
            - enabled
            type: object
          status:
            description: AutomatedProceduresConfigStatus defines the observed state
              of AutomatedProceduresConfig.
            properties:
              activeEventRef:
                description: ActiveEventRef is the name of the current active PowerEvent.
                type: string
              alertEndpointReady:
                description: AlertEndpointReady indicates the alert webhook server
                  is listening.
                type: boolean
              conditions:
                description: Conditions represent the latest available observations.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              eventSources:
                description: EventSources reports the status of each configured event
                  source.
                items:
                  description: EventSourceStatus reports the status of a single event
                    source.
                  properties:
                    connected:
                      description: Connected indicates whether the source is reachable.
                      type: boolean
                    lastCheck:
                      description: LastCheck is the last time connectivity was verified.
                      format: date-time
                      type: string
                    message:
                      description: Message provides additional detail.
                      type: string
                    type:
                      description: 'Type is the source type: "webhook", "snmp", "ipmi",
                        "nut".'
                      type: string
                  required:
                  - connected
                  - type
                  type: object
                type: array
              lastPowerEvent:
                description: LastPowerEvent is the timestamp of the last power event.
                format: date-time
                type: string
              powerStatus:
                description: PowerStatus is the current power state.
                enum:
                - Normal
                - OnBattery
                - Unknown
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
