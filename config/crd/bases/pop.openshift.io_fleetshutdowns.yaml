---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.1
  name: fleetshutdowns.pop.openshift.io
spec:
  group: pop.openshift.io
  names:
    kind: FleetShutdown
    listKind: FleetShutdownList
    plural: fleetshutdowns
    singular: fleetshutdown
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.selectedClusters
      name: Selected
      type: integer
    - jsonPath: .status.completedClusters
      name: Completed
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          FleetShutdown is a hub-authored intent to gracefully shut down a selected set
          of managed clusters. The hub controller fans out a per-spoke ClusterShutdown
          via ManifestWork.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: FleetShutdownSpec defines the desired state of FleetShutdown.
            properties:
              dryRun:
                default: false
                description: DryRun passes through to each spoke ClusterShutdown.
                type: boolean
              placementRef:
                description: PlacementRef names an ACM Placement (same namespace)
                  selecting target clusters.
                minLength: 1
                type: string
              pvcName:
                description: PVCName is passed through to each spoke ClusterShutdown's
                  etcd backup.
                minLength: 1
                type: string
              reason:
                description: Reason documents why the fleet shutdown is happening
                  (audit trail).
                type: string
              shutdownPolicy:
                description: ShutdownPolicy is inherited by each spoke ClusterShutdown.
                properties:
                  hardDeadlineSeconds:
                    description: HardDeadlineSeconds bounds the whole spoke shutdown
                      before force-progress.
                    format: int32
                    type: integer
                  onStuck:
                    default: force
                    description: OnStuck selects the per-phase stuck behavior on the
                      spoke.
                    enum:
                    - force
                    - skip
                    - haltAndAlert
                    - escalateToHub
                    type: string
                type: object
            required:
            - placementRef
            - pvcName
            type: object
          status:
            description: FleetShutdownStatus defines the observed state of FleetShutdown.
            properties:
              clusters:
                description: Clusters is the per-cluster shutdown progress.
                items:
                  description: |-
                    FleetClusterStatus is the per-cluster shutdown progress, aggregated from the
                    ManifestWork status feedback of each spoke's ClusterShutdown.
                  properties:
                    backupRef:
                      description: |-
                        BackupRef is the EtcdBackup CR name taken on this spoke before shutdown,
                        surfaced from the spoke ClusterShutdown's status.etcdBackupRef via
                        ManifestWork feedback. Empty until the spoke reports it.
                      type: string
                    message:
                      type: string
                    name:
                      type: string
                    phase:
                      type: string
                  required:
                  - name
                  type: object
                type: array
              completedClusters:
                description: CompletedClusters is the number of clusters whose shutdown
                  has completed.
                format: int32
                type: integer
              conditions:
                description: Conditions represent the latest available observations.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              message:
                description: Message provides detail about the current phase.
                type: string
              observedGeneration:
                description: ObservedGeneration is the most recent generation observed.
                format: int64
                type: integer
              phase:
                enum:
                - Pending
                - InProgress
                - Completed
                - PartiallyFailed
                type: string
              selectedClusters:
                description: SelectedClusters is the number of clusters selected by
                  the Placement.
                format: int32
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
