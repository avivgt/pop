---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.1
  name: etcdbackups.pop.openshift.io
spec:
  group: pop.openshift.io
  names:
    kind: EtcdBackup
    listKind: EtcdBackupList
    plural: etcdbackups
    singular: etcdbackup
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.backupNode
      name: Node
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          EtcdBackup triggers a one-shot etcd backup on a control plane node
          and exports the artifacts to a PVC.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: EtcdBackupSpec defines the desired state of EtcdBackup.
            properties:
              backupTimeoutMinutes:
                default: 15
                description: BackupTimeoutMinutes is the maximum time allowed for
                  the backup Job to complete.
                format: int32
                maximum: 60
                minimum: 1
                type: integer
              controlPlaneNode:
                description: |-
                  ControlPlaneNode optionally specifies which control plane node to run the
                  backup on. If empty, the controller selects one automatically.
                type: string
              exportTarget:
                description: |-
                  ExportTarget defines where backup artifacts are exported.
                  Defaults to PVC export using PVCName.
                properties:
                  s3:
                    description: S3 is required when Type is S3.
                    properties:
                      bucket:
                        description: Bucket is the S3 bucket name.
                        minLength: 1
                        type: string
                      credentialsSecret:
                        description: CredentialsSecret is the name of a Secret containing
                          "access-key" and "secret-key".
                        minLength: 1
                        type: string
                      endpoint:
                        description: Endpoint is the S3-compatible endpoint URL (for
                          MinIO, ODF, etc.).
                        type: string
                      prefix:
                        description: Prefix is a path prefix within the bucket.
                        type: string
                      region:
                        default: us-east-1
                        description: Region is the AWS region.
                        type: string
                    required:
                    - bucket
                    - credentialsSecret
                    type: object
                  type:
                    default: PVC
                    description: Type is PVC or S3.
                    enum:
                    - PVC
                    - S3
                    type: string
                required:
                - type
                type: object
              pvcName:
                description: |-
                  PVCName is the name of the PersistentVolumeClaim where backups are stored.
                  The PVC must exist in the same namespace as the EtcdBackup resource.
                minLength: 1
                type: string
            required:
            - pvcName
            type: object
          status:
            description: EtcdBackupStatus defines the observed state of EtcdBackup.
            properties:
              backupNode:
                description: BackupNode is the control plane node where the backup
                  was taken.
                type: string
              backupPath:
                description: BackupPath is the path within the PVC where backup files
                  are stored.
                type: string
              completionTime:
                description: CompletionTime is when the backup completed.
                format: date-time
                type: string
              conditions:
                description: Conditions represent the latest available observations.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              jobName:
                description: JobName is the name of the backup Job created by this
                  resource.
                type: string
              message:
                description: Message provides detail about the current phase.
                type: string
              phase:
                description: Phase is the current phase of the backup.
                enum:
                - Pending
                - Validating
                - Running
                - Completed
                - Failed
                type: string
              s3URI:
                description: S3URI is the S3 object URI if exported to S3.
                type: string
              snapshotFile:
                description: SnapshotFile is the name of the etcd snapshot file.
                type: string
              startTime:
                description: StartTime is when the backup started.
                format: date-time
                type: string
              staticResourcesFile:
                description: StaticResourcesFile is the name of the static resources
                  archive.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
