---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.1
  name: backupschedules.pop.openshift.io
spec:
  group: pop.openshift.io
  names:
    kind: BackupSchedule
    listKind: BackupScheduleList
    plural: backupschedules
    singular: backupschedule
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.frequency
      name: Frequency
      type: string
    - jsonPath: .status.humanReadableSchedule
      name: Schedule
      type: string
    - jsonPath: .spec.suspend
      name: Suspend
      type: boolean
    - jsonPath: .status.lastBackupTime
      name: Last Backup
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: BackupSchedule creates EtcdBackup CRs on a cron schedule with
          retention.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: BackupScheduleSpec defines the desired state of BackupSchedule.
            properties:
              backupTimeoutMinutes:
                default: 15
                description: BackupTimeoutMinutes passed through to each created EtcdBackup.
                format: int32
                maximum: 60
                minimum: 1
                type: integer
              customInterval:
                description: |-
                  CustomInterval defines a custom repeat interval.
                  Used when frequency is "Custom".
                properties:
                  every:
                    description: Every is the interval value.
                    format: int32
                    minimum: 1
                    type: integer
                  unit:
                    description: Unit is the interval unit.
                    enum:
                    - Minutes
                    - Hours
                    - Days
                    type: string
                required:
                - every
                - unit
                type: object
              dayOfMonth:
                description: DayOfMonth is the day for Monthly frequency (1-28).
                format: int32
                maximum: 28
                minimum: 1
                type: integer
              dayOfWeek:
                description: DayOfWeek is the day for Weekly frequency.
                enum:
                - Sunday
                - Monday
                - Tuesday
                - Wednesday
                - Thursday
                - Friday
                - Saturday
                type: string
              exportTarget:
                description: ExportTarget optionally configures S3 export for scheduled
                  backups.
                properties:
                  s3:
                    description: S3 is required when Type is S3.
                    properties:
                      bucket:
                        description: Bucket is the S3 bucket name.
                        minLength: 1
                        type: string
                      credentialsSecret:
                        description: CredentialsSecret is the name of a Secret containing
                          "access-key" and "secret-key".
                        minLength: 1
                        type: string
                      endpoint:
                        description: Endpoint is the S3-compatible endpoint URL (for
                          MinIO, ODF, etc.).
                        type: string
                      prefix:
                        description: Prefix is a path prefix within the bucket.
                        type: string
                      region:
                        default: us-east-1
                        description: Region is the AWS region.
                        type: string
                    required:
                    - bucket
                    - credentialsSecret
                    type: object
                  type:
                    default: PVC
                    description: Type is PVC or S3.
                    enum:
                    - PVC
                    - S3
                    type: string
                required:
                - type
                type: object
              frequency:
                default: Daily
                description: |-
                  Frequency is the backup frequency preset.
                  Use "Now" to trigger an immediate backup, then continue on the next preset.
                  Use "Custom" with customInterval for non-standard intervals.
                enum:
                - Now
                - Every4Hours
                - Every8Hours
                - Every12Hours
                - Daily
                - Weekly
                - Monthly
                - Custom
                type: string
              pvcName:
                description: PVCName is the PVC for etcd backup storage.
                minLength: 1
                type: string
              retentionCount:
                default: 10
                description: RetentionCount is the maximum number of completed backups
                  to keep.
                format: int32
                minimum: 1
                type: integer
              retentionDays:
                default: 30
                description: RetentionDays is the maximum age (in days) of backups
                  to keep.
                format: int32
                minimum: 1
                type: integer
              schedule:
                description: |-
                  Schedule is a raw cron expression for advanced users.
                  If set, this overrides the frequency/time/day fields.
                type: string
              suspend:
                default: false
                description: Suspend pauses scheduling when true.
                type: boolean
              time:
                default: "02:00"
                description: |-
                  Time is the time of day in HH:MM format (UTC).
                  Used with Daily, Weekly, and Monthly frequencies.
                pattern: ^([01]\d|2[0-3]):[0-5]\d$
                type: string
            required:
            - pvcName
            type: object
          status:
            description: BackupScheduleStatus defines the observed state of BackupSchedule.
            properties:
              activeBackup:
                description: ActiveBackup is the name of the in-progress EtcdBackup,
                  if any.
                type: string
              conditions:
                description: Conditions represent the latest available observations.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              failedBackupsCount:
                description: FailedBackupsCount is the running count of failed scheduled
                  backups.
                format: int32
                type: integer
              humanReadableSchedule:
                description: HumanReadableSchedule is a user-friendly description
                  of the schedule.
                type: string
              lastBackupTime:
                description: LastBackupTime is when the most recent backup was triggered.
                format: date-time
                type: string
              lastSuccessfulBackup:
                description: LastSuccessfulBackup is the name of the most recent successful
                  EtcdBackup.
                type: string
              nextBackupTime:
                description: NextBackupTime is the computed next trigger time.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the most recent generation observed.
                format: int64
                type: integer
              phase:
                description: Phase is Active or Suspended.
                type: string
              resolvedSchedule:
                description: ResolvedSchedule is the cron expression computed from
                  the frequency fields.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
