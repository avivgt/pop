# permissions for end users to edit clusterlifecycleconfigs.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: pop
    app.kubernetes.io/managed-by: kustomize
  name: clusterlifecycleconfig-editor-role
rules:
- apiGroups:
  - pop.openshift.io
  resources:
  - clusterlifecycleconfigs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - pop.openshift.io
  resources:
  - clusterlifecycleconfigs/status
  verbs:
  - get
