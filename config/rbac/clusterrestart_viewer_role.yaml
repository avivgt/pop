# permissions for end users to view clusterrestarts.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: pop
    app.kubernetes.io/managed-by: kustomize
  name: clusterrestart-viewer-role
rules:
- apiGroups:
  - pop.openshift.io
  resources:
  - clusterrestarts
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - pop.openshift.io
  resources:
  - clusterrestarts/status
  verbs:
  - get
