# permissions for end users to view automatedproceduresconfigs.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: pop
    app.kubernetes.io/managed-by: kustomize
  name: automatedproceduresconfig-viewer-role
rules:
- apiGroups:
  - pop.openshift.io
  resources:
  - automatedproceduresconfigs
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - pop.openshift.io
  resources:
  - automatedproceduresconfigs/status
  verbs:
  - get
