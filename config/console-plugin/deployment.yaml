apiVersion: apps/v1
kind: Deployment
metadata:
  name: pop-console-plugin
  namespace: pop-system
  labels:
    app: pop-console-plugin
    app.kubernetes.io/component: console-plugin
    app.kubernetes.io/part-of: pop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pop-console-plugin
  template:
    metadata:
      labels:
        app: pop-console-plugin
    spec:
      containers:
        - name: pop-console-plugin
          image: image-registry.openshift-image-registry.svc:5000/pop-system/pop-console-plugin:v0.1.2
          ports:
            - containerPort: 9443
              protocol: TCP
              name: https
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - name: serving-cert
              mountPath: /var/serving-cert
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: 9443
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 9443
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: serving-cert
          secret:
            secretName: pop-console-plugin-cert
