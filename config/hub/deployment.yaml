apiVersion: apps/v1
kind: Deployment
metadata:
  name: pop-hub
  namespace: pop-system
  labels:
    app.kubernetes.io/name: pop-hub
    app.kubernetes.io/managed-by: pop-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pop-hub
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pop-hub
    spec:
      serviceAccountName: pop-hub
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hub
          image: openshift.io/pop-hub:v0.2.0
          args:
            - --leader-elect
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:8080
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      terminationGracePeriodSeconds: 10
