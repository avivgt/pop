apiVersion: pop.openshift.io/v1alpha1
kind: AutomatedProceduresConfig
metadata:
  labels:
    app.kubernetes.io/name: pop
    app.kubernetes.io/managed-by: kustomize
  name: default
  namespace: pop-system
spec:
  enabled: true
  clusterPriority: Standard           # Critical | Standard | BestEffort
  batteryCapacityMinutes: 15
  powerConfirmationSeconds: 120       # wait 2 min before confirming outage
  autonomousShutdown: true            # auto-shutdown after confirmation + delay

  backupConfig:
    pvcName: etcd-backup-storage
    shutdownDelayMinutes: 1

  alertEndpoint:
    port: 8082
    authTokenSecret: psu-alert-token  # Secret with "token" key for bearer auth

  eventSources:
    webhook:
      port: 8082
    # snmp:
    #   enabled: true
    #   host: "192.168.1.100"
    #   port: 161
    #   community: "public"
    #   version: "v2c"
    #   pollingIntervalSeconds: 30
    # ipmi:
    #   enabled: true
    #   host: "192.168.1.200"
    #   protocol: "redfish"
    #   authSecret: bmc-credentials
    # nut:
    #   enabled: true
    #   host: "192.168.1.50"
    #   upsName: "ups-1"
    #   pollingIntervalSeconds: 10

  notification:
    kubernetesEvents:
      enabled: true
    webhook:
      enabled: true
      url: "https://hooks.slack.com/services/REPLACE_ME"
    smtp:
      enabled: false
    alertmanager:
      enabled: true
