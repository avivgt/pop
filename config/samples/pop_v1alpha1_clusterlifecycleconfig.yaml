apiVersion: pop.openshift.io/v1alpha1
kind: ClusterLifecycleConfig
metadata:
  labels:
    app.kubernetes.io/name: pop
    app.kubernetes.io/managed-by: kustomize
  name: default
  namespace: pop-system
spec:
  backup:
    storage:
      pvcName: etcd-backup-storage
    schedule:
      enabled: true
      frequency: Daily
      time: "02:00"
    retention:
      count: 10
      days: 30
    timeoutMinutes: 15

  shutdown:
    defaultDelayMinutes: 1
    cordonNodes: true
    notifyApplications: true

  notification:
    kubernetesEvents:
      enabled: true
