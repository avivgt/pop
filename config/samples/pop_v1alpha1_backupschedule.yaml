apiVersion: pop.openshift.io/v1alpha1
kind: BackupSchedule
metadata:
  labels:
    app.kubernetes.io/name: pop
    app.kubernetes.io/managed-by: kustomize
  name: daily-backup
  namespace: pop-system
spec:
  frequency: Daily                    # Now | Every4Hours | Every8Hours | Every12Hours | Daily | Weekly | Monthly | Custom
  time: "02:00"                       # HH:MM UTC (used with Daily, Weekly, Monthly)
  # dayOfWeek: Monday                 # for Weekly frequency
  # dayOfMonth: 1                     # for Monthly frequency (1-28)
  # customInterval:                   # for Custom frequency
  #   every: 6
  #   unit: Hours                     # Minutes | Hours | Days
  pvcName: etcd-backup-storage
  retentionCount: 10
  retentionDays: 30
  suspend: false
  backupTimeoutMinutes: 15
