apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: pop-spoke-deployment
  namespace: pop-system
  annotations:
    policy.open-cluster-management.io/categories: CM Configuration Management
    policy.open-cluster-management.io/controls: CM-2 Baseline Configuration
    policy.open-cluster-management.io/standards: NIST SP 800-53
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: pop-spoke-namespace
        spec:
          remediationAction: enforce
          severity: low
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Namespace
                metadata:
                  name: pop-system
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: pop-spoke-catalog
        spec:
          remediationAction: enforce
          severity: low
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: operators.coreos.com/v1alpha1
                kind: CatalogSource
                metadata:
                  name: pop-catalog
                  namespace: pop-system
                spec:
                  sourceType: grpc
                  image: quay.io/aguetta/pop-catalog:v0.2.1
                  displayName: POP Operators
                  publisher: POP Project
                  updateStrategy:
                    registryPoll:
                      interval: 15m
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: pop-spoke-operatorgroup
        spec:
          remediationAction: enforce
          severity: low
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: operators.coreos.com/v1
                kind: OperatorGroup
                metadata:
                  name: pop-operator-group
                  namespace: pop-system
                spec:
                  targetNamespaces:
                    - pop-system
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: pop-spoke-subscription
        spec:
          remediationAction: enforce
          severity: low
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: operators.coreos.com/v1alpha1
                kind: Subscription
                metadata:
                  name: pop
                  namespace: pop-system
                spec:
                  channel: alpha
                  name: pop
                  source: pop-catalog
                  sourceNamespace: pop-system
                  installPlanApproval: Automatic
