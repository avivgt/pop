apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: pop-all-clusters
  namespace: pop-system
spec:
  tolerations:
    - key: cluster.open-cluster-management.io/unreachable
      operator: Exists
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchLabels:
            pop.openshift.io/enabled: "true"
