apiVersion: v1
kind: ConfigMap
metadata:
  name: pop-fleet-dashboard
  namespace: open-cluster-management-observability
  labels:
    grafana-custom-dashboard: "true"
data:
  pop-fleet.json: |
    {
      "title": "POP Fleet",
      "uid": "pop-fleet",
      "schemaVersion": 39,
      "panels": [
        {
          "type": "stat",
          "title": "Sites on battery",
          "targets": [{ "expr": "count(pop_power_status == 1)" }],
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 }
        },
        {
          "type": "table",
          "title": "Power status by cluster",
          "targets": [{ "expr": "pop_power_status", "format": "table", "instant": true }],
          "gridPos": { "h": 8, "w": 18, "x": 6, "y": 0 }
        },
        {
          "type": "table",
          "title": "Etcd backup age (s) by cluster",
          "targets": [{ "expr": "time() - pop_etcd_backup_last_success_timestamp", "format": "table", "instant": true }],
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 8 }
        }
      ]
    }
