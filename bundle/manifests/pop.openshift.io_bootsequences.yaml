---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.1
  name: bootsequences.pop.openshift.io
spec:
  group: pop.openshift.io
  names:
    kind: BootSequence
    listKind: BootSequenceList
    plural: bootsequences
    singular: bootsequence
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          BootSequence is standing GitOps config that observes an ordered, health-gated
          intra-cluster workload black-start (e.g. storage Ready before apps). It does
          not scale or hold workloads; it reports whether selected namespaces become
          Ready in DAG order. A new ClusterRestart re-runs a completed sequence.
          It is the workload-layer complement to the hub's FleetBootSequence.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: BootSequenceSpec defines the desired state of BootSequence.
            properties:
              stages:
                description: |-
                  Stages are the ordered workload stages. Ordering is by DependsOn (a DAG),
                  not list order.
                items:
                  description: BootStage is one ordered stage of the intra-cluster
                    workload black-start.
                  properties:
                    dependsOn:
                      description: |-
                        DependsOn lists stage names that must be Ready before this stage is
                        evaluated. Ordering is by this DAG, not list order.
                      items:
                        type: string
                      type: array
                    healthGate:
                      default: AllPodsReady
                      description: |-
                        HealthGate is the readiness condition that must hold before dependent
                        stages are considered Ready. AllPodsReady: every selected namespace
                        exists and has at least one non-completed pod, and every such pod is
                        Ready. Empty or missing namespaces do not pass.
                      enum:
                      - AllPodsReady
                      type: string
                    name:
                      description: Name is a unique identifier for the stage.
                      minLength: 1
                      type: string
                    onStuck:
                      default: haltAndAlert
                      description: |-
                        OnStuck selects behavior when the stage does not become Ready within its
                        timeout. force: proceed to dependents anyway; haltAndAlert: stop the
                        sequence and mark TimedOut (default).
                      enum:
                      - force
                      - haltAndAlert
                      type: string
                    selector:
                      description: Selector picks the workloads this stage gates on.
                      properties:
                        namespaces:
                          description: Namespaces are the namespaces whose pods this
                            stage gates on.
                          items:
                            type: string
                          minItems: 1
                          type: array
                      required:
                      - namespaces
                      type: object
                    timeoutSeconds:
                      default: 600
                      description: |-
                        TimeoutSeconds bounds how long to wait for this stage to become Ready
                        before the sequence is marked TimedOut.
                      format: int32
                      minimum: 30
                      type: integer
                  required:
                  - name
                  - selector
                  type: object
                minItems: 1
                type: array
            required:
            - stages
            type: object
          status:
            description: BootSequenceStatus defines the observed state of BootSequence.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              lastClusterRestartUID:
                description: |-
                  LastClusterRestartUID is the ClusterRestart that started this run.
                  A newer ClusterRestart UID re-runs a standing (GitOps) BootSequence.
                type: string
              message:
                type: string
              observedGeneration:
                format: int64
                type: integer
              phase:
                enum:
                - Pending
                - InProgress
                - Complete
                - TimedOut
                - Failed
                type: string
              stages:
                items:
                  description: BootStageStatus is the observed readiness of a stage.
                  properties:
                    eligibleSince:
                      description: |-
                        EligibleSince is when this stage's dependencies first became Ready.
                        TimeoutSeconds is measured from this instant, not from sequence start.
                      format: date-time
                      type: string
                    forced:
                      type: boolean
                    message:
                      type: string
                    name:
                      type: string
                    podsReady:
                      format: int32
                      type: integer
                    podsTotal:
                      format: int32
                      type: integer
                    ready:
                      type: boolean
                  required:
                  - name
                  - podsReady
                  - podsTotal
                  - ready
                  type: object
                type: array
              startTime:
                format: date-time
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
