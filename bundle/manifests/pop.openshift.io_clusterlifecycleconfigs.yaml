                  schedule:
                    description: Schedule configures automatic backup timing.
                    properties:
                      customInterval:
                        description: CustomInterval for Custom frequency.
                        properties:
                          every:
                            description: Every is the interval value.
                            format: int32
                            minimum: 1
                            type: integer
                          unit:
                            description: Unit is the interval unit.
                            enum:
                            - Minutes
                            - Hours
                            - Days
                            type: string
                        required:
                        - every
                        - unit
                        type: object
                      dayOfMonth:
                        description: DayOfMonth for Monthly frequency (1-28).
                        format: int32
                        maximum: 28
                        minimum: 1
                        type: integer
                      dayOfWeek:
                        description: DayOfWeek for Weekly frequency.
                        enum:
                        - Sunday
                        - Monday
                        - Tuesday
                        - Wednesday
                        - Thursday
                        - Friday
                        - Saturday
                        type: string
                      enabled:
                        default: true
                        description: Enabled activates automatic scheduled backups.
                        type: boolean
                      frequency:
                        default: Daily
                        description: Frequency is the backup frequency preset.
                        enum:
                        - Every4Hours
                        - Every8Hours
                        - Every12Hours
                        - Daily
                        - Weekly
                        - Monthly
                        - Custom
                        type: string
                      time:
                        default: "02:00"
                        description: Time is the time of day in HH:MM format (UTC).
                        pattern: ^([01]\d|2[0-3]):[0-5]\d$
                        type: string
                    required:
                    - enabled
                    type: object
                  storage:
                    description: Storage defines where backups are stored.
                    properties:
                      exportTarget:
                        description: ExportTarget optionally configures S3 export.
                        properties:
                          s3:
                            description: S3 is required when Type is S3.
                            properties:
                              bucket:
                                description: Bucket is the S3 bucket name.
                                minLength: 1
                                type: string
                              credentialsSecret:
                                description: CredentialsSecret is the name of a Secret
