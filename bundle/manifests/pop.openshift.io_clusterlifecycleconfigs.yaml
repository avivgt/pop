              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ClusterLifecycleConfigSpec is the single configuration for
              all POP features.
            properties:
              backup:
                description: Backup configures etcd backup storage, scheduling, and
                  retention.
                properties:
                  retention:
                    description: Retention configures backup cleanup policy.
                    properties:
                      count:
                        default: 10
                        description: Count is the maximum number of completed backups
                          to keep.
                        format: int32
                        minimum: 1
                        type: integer
                      days:
                        default: 30
                        description: Days is the maximum age of backups in days.
                        format: int32
                        minimum: 1
                        type: integer
