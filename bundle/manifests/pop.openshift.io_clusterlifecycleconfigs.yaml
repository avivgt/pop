                        required:
                        - type
                        type: object
                      pvcName:
                        description: PVCName is the PVC for etcd backup storage.
                        minLength: 1
                        type: string
                    required:
                    - pvcName
                    type: object
                  timeoutMinutes:
                    default: 15
                    description: TimeoutMinutes is the maximum time for a backup job.
                    format: int32
                    maximum: 60
                    minimum: 1
                    type: integer
                required:
                - storage
                type: object
              notification:
                description: Notification configures alert channels.
                properties:
                  alertmanager:
                    description: Alertmanager configures Alertmanager push notifications.
                    properties:
                      enabled:
                        default: false
                        description: Enabled activates Alertmanager notifications.
                        type: boolean
                      url:
                        description: |-
                          URL is the Alertmanager API endpoint.
                          Defaults to the cluster's built-in Alertmanager if empty.
                        type: string
                    required:
                    - enabled
                    type: object
                  kubernetesEvents:
                    description: KubernetesEvents configures K8s Event emission.
                    properties:
                      enabled:
                        default: true
                        description: Enabled activates Kubernetes Event emission.
                        type: boolean
                    required:
                    - enabled
                    type: object
                  smtp:
