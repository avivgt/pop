                        type: string
                      enabled:
                        default: false
                        description: Enabled activates webhook notifications.
                        type: boolean
                      url:
                        description: URL is the target for POST JSON notifications.
                        type: string
                    required:
                    - enabled
                    type: object
                type: object
              shutdown:
                description: Shutdown configures cluster shutdown defaults.
                properties:
                  cordonNodes:
                    default: true
                    description: CordonNodes when true cordons all nodes before shutdown.
                    type: boolean
                  defaultDelayMinutes:
                    default: 1
                    description: |-
                      DefaultDelayMinutes is the shutdown delay for worker nodes.
                      Control plane nodes get double this value.
                    format: int32
                    minimum: 1
                    type: integer
                  notifyApplications:
                    default: true
                    description: NotifyApplications creates a ConfigMap signal before
                      shutdown.
                    type: boolean
                  preShutdownHooks:
                    description: PreShutdownHooks are Jobs to run before shutdown.
                    items:
                      properties:
                        command:
                          description: Command is the command to execute.
                          items:
                            type: string
                          type: array
                        image:
                          description: Image is the container image to run.
                          type: string
                        name:
                          description: Name is a human-readable identifier for this
