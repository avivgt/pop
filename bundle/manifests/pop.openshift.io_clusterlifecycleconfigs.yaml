                                minLength: 1
                                type: string
                              endpoint:
                                description: Endpoint is the S3-compatible endpoint
                                  URL (for MinIO, ODF, etc.).
                                type: string
                              prefix:
                                description: Prefix is a path prefix within the bucket.
                                type: string
                              region:
                                default: us-east-1
                                description: Region is the AWS region.
