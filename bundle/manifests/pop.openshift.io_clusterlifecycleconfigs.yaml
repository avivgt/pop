                          type: string
                        timeoutSeconds:
                          default: 300
                          description: TimeoutSeconds is the maximum time for this
                            hook to complete.
                          format: int32
                          type: integer
                      required:
                      - command
                      - image
                      - name
                      - timeoutSeconds
                      type: object
                    type: array
                type: object
            required:
