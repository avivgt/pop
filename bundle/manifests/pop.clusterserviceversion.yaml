apiVersion: operators.coreos.com/v1alpha1
kind: ClusterServiceVersion
metadata:
  annotations:
    alm-examples: |-
      [
        {
          "apiVersion": "pop.openshift.io/v1alpha1",
          "kind": "BackupSchedule",
          "metadata": {
            "labels": {
              "app.kubernetes.io/managed-by": "kustomize",
              "app.kubernetes.io/name": "pop"
            },
            "name": "daily-backup",
            "namespace": "pop-system"
          },
          "spec": {
            "backupTimeoutMinutes": 15,
            "pvcName": "etcd-backup-storage",
            "retentionCount": 10,
            "retentionDays": 30,
            "schedule": "0 2 * * *",
            "suspend": false
          }
        },
        {
          "apiVersion": "pop.openshift.io/v1alpha1",
          "kind": "ClusterRestart",
          "metadata": {
            "labels": {
              "app.kubernetes.io/managed-by": "kustomize",
              "app.kubernetes.io/name": "pop"
            },
            "name": "post-outage-restart",
            "namespace": "pop-system"
          },
          "spec": {
            "autoApproveCSRs": true,
            "waitTimeoutMinutes": 30
          }
        },
        {
          "apiVersion": "pop.openshift.io/v1alpha1",
          "kind": "ClusterShutdown",
          "metadata": {
            "labels": {
              "app.kubernetes.io/managed-by": "kustomize",
              "app.kubernetes.io/name": "pop"
            },
            "name": "planned-outage",
            "namespace": "pop-system"
          },
          "spec": {
            "certExpiryThresholdDays": 30,
            "cordonNodes": true,
            "dryRun": true,
            "notifyApplications": true,
            "preShutdownHooks": [
              {
                "command": [
                  "/bin/bash",
                  "-c",
                  "echo 'Flushing databases...'"
                ],
                "image": "registry.redhat.io/ubi9/ubi-minimal:latest",
                "name": "flush-databases",
                "timeoutSeconds": 300
              },
              {
                "command": [
                  "/bin/bash",
                  "-c",
                  "echo 'Removing from load balancer...'"
                ],
                "image": "registry.redhat.io/ubi9/ubi-minimal:latest",
                "name": "deregister-from-lb",
                "timeoutSeconds": 120
              }
            ],
            "pvcName": "etcd-backup-storage",
            "reason": "Quarterly datacenter maintenance",
            "shutdownDelayMinutes": 1,
            "skipCertCheck": false
          }
        },
        {
          "apiVersion": "pop.openshift.io/v1alpha1",
          "kind": "EtcdBackup",
          "metadata": {
            "labels": {
              "app.kubernetes.io/managed-by": "kustomize",
              "app.kubernetes.io/name": "pop"
            },
            "name": "manual-backup",
            "namespace": "pop-system"
          },
          "spec": {
            "backupTimeoutMinutes": 15,
            "pvcName": "etcd-backup-storage"
          }
        },
        {
          "apiVersion": "pop.openshift.io/v1alpha1",
          "kind": "PowerEvent",
          "metadata": {
            "labels": {
              "app.kubernetes.io/managed-by": "kustomize",
              "app.kubernetes.io/name": "pop"
            },
            "name": "test-event",
            "namespace": "pop-system"
          },
          "spec": {
            "eventType": "Test",
            "message": "Manual test of power event system",
            "source": "manual-test",
            "triggeredBy": "manual"
          }
        },
        {
          "apiVersion": "pop.openshift.io/v1alpha1",
          "kind": "PowerProtectionConfig",
          "metadata": {
            "labels": {
              "app.kubernetes.io/managed-by": "kustomize",
              "app.kubernetes.io/name": "pop"
            },
            "name": "default",
            "namespace": "pop-system"
          },
          "spec": {
            "alertEndpoint": {
              "authTokenSecret": "psu-alert-token",
              "port": 8082
            },
            "autonomousShutdown": true,
            "backupConfig": {
              "pvcName": "etcd-backup-storage",
              "shutdownDelayMinutes": 1
            },
            "batteryCapacityMinutes": 15,
            "clusterPriority": "Standard",
            "enabled": true,
            "notification": {
              "alertmanager": {
                "enabled": true
              },
              "kubernetesEvents": {
                "enabled": true
              },
              "smtp": {
                "enabled": false
              },
              "webhook": {
                "enabled": true,
                "url": "https://hooks.slack.com/services/REPLACE_ME"
              }
            },
            "powerConfirmationSeconds": 120
          }
        },
        {
          "apiVersion": "pop.openshift.io/v1alpha1",
          "kind": "WorkloadEvacuation",
          "metadata": {
            "labels": {
              "app.kubernetes.io/managed-by": "kustomize",
              "app.kubernetes.io/name": "pop"
            },
            "name": "pre-maint-evacuation",
            "namespace": "pop-system"
          },
          "spec": {
            "dryRun": true,
            "namespaces": [
              "app-frontend",
              "app-backend",
              "app-data"
            ],
            "reason": "Pre-maintenance workload migration",
            "strategy": "Canary",
            "targetClusters": [
              "ocp-prod-west",
              "ocp-prod-east"
            ],
            "waves": [
              {
                "percent": 10,
                "verifyDurationSeconds": 300
              },
              {
                "percent": 50,
                "verifyDurationSeconds": 300
              },
              {
                "percent": 100,
                "verifyDurationSeconds": 60
              }
            ]
          }
        }
      ]
    capabilities: Basic Install
    console.openshift.io/plugins: '["pop-console-plugin"]'
    createdAt: "2026-04-18T10:20:11Z"
    operators.operatorframework.io/builder: operator-sdk-v1.39.2
    operators.operatorframework.io/project_layout: go.kubebuilder.io/v4
  name: pop.v0.1.0
  namespace: placeholder
spec:
  apiservicedefinitions: {}
  customresourcedefinitions:
    owned:
    - description: BackupSchedule creates EtcdBackup CRs on a cron schedule with retention.
      displayName: Backup Schedule
      kind: BackupSchedule
      name: backupschedules.pop.openshift.io
      version: v1alpha1
    - description: |-
        ClusterRestart orchestrates bringing an OpenShift cluster back up
        after a graceful shutdown.
      displayName: Cluster Restart
      kind: ClusterRestart
      name: clusterrestarts.pop.openshift.io
      version: v1alpha1
    - description: |-
        ClusterShutdown orchestrates a full OpenShift graceful shutdown:
        validate prerequisites, back up etcd, and shut down all nodes.
      displayName: Cluster Shutdown
      kind: ClusterShutdown
      name: clustershutdowns.pop.openshift.io
      version: v1alpha1
    - description: |-
        EtcdBackup triggers a one-shot etcd backup on a control plane node
        and exports the artifacts to a PVC.
      displayName: Etcd Backup
      kind: EtcdBackup
      name: etcdbackups.pop.openshift.io
      version: v1alpha1
    - description: PowerEvent represents a power-related event detected by the PSU
        alert system.
      displayName: Power Event
      kind: PowerEvent
      name: powerevents.pop.openshift.io
      version: v1alpha1
    - description: PowerProtectionConfig configures UPS/PSU-driven power protection
        for the cluster.
      displayName: Power Protection Config
      kind: PowerProtectionConfig
      name: powerprotectionconfigs.pop.openshift.io
      version: v1alpha1
    - description: |-
        WorkloadEvacuation requests ACM to migrate workloads away from this cluster,
        supporting canary/A-B testing style gradual migration.
      displayName: Workload Evacuation
      kind: WorkloadEvacuation
      name: workloadevacuations.pop.openshift.io
      version: v1alpha1
  description: |
    POP (Power Outage Provisioner) automates OpenShift cluster lifecycle operations:
    - Etcd backup with PVC and S3 export
    - Scheduled backups with retention policies
    - Graceful cluster shutdown following OpenShift documentation
    - Cluster restart with automatic CSR approval and operator health verification
    - OpenShift Console plugin for visual management
  displayName: POP - Power Outage Provisioner
  icon:
